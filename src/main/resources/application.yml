spring:
  application:
    name: payment-collection-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USERNAME:payments}
    password: ${DB_PASSWORD:payments}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Must be at least 256 bits (32 bytes). Override in production.
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-1234}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  gateway:
    provider: ${PAYMENT_GATEWAY:mock}
    retry:
      max-attempts: 3
      initial-interval-ms: 200
      multiplier: 2.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.hackathon.payment: INFO
