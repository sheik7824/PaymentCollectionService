services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payments
      DB_USERNAME: payments
      DB_PASSWORD: payments
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-1234}
      PAYMENT_GATEWAY: mock
    ports:
      - "8080:8080"

volumes:
  pgdata:
