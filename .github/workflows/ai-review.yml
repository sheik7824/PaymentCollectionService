# Runs the AI review agent for pull requests targeting the main branch.

name: AI Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout review agent
        uses: actions/checkout@v5
        with:
          repository: sheik7824/CodeReviewAgent
          ref: main
          path: .review-agent

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install review agent
        run: python -m pip install ./.review-agent

      - name: Run AI review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LLM_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o' }}
          # Keep the review informative without blocking this demo PR.
          MAX_CRITICAL: "0"
          MAX_HIGH: "5"
          MAX_MEDIUM: "5"
#          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          python -m review_agent \
            --repo . \
            --pr "${{ github.event.pull_request.number }}" \
            --base "${{ github.base_ref }}" \
            --head "${{ github.event.pull_request.head.ref }}" \
            --commit "${{ github.event.pull_request.head.sha }}" \
            --report review-report.json \
            --status-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --publish

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ai-review-report
          path: review-report.json

  ai-review-with-judge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout review agent
        uses: actions/checkout@v5
        with:
          repository: sheik7824/CodeReviewAgent-WithJudge
          ref: main
          path: .review-agent-with-judge

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install review agent
        run: python -m pip install ./.review-agent-with-judge

      - name: Run AI review with judge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LLM_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o' }}
          # Keep the review informative without blocking this demo PR.
          MAX_CRITICAL: "0"
          MAX_HIGH: "5"
          MAX_MEDIUM: "5"
#          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          python -m review_agent \
            --repo . \
            --pr "${{ github.event.pull_request.number }}" \
            --base "${{ github.base_ref }}" \
            --head "${{ github.event.pull_request.head.ref }}" \
            --commit "${{ github.event.pull_request.head.sha }}" \
            --report review-report-with-judge.json \
            --status-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --publish

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ai-review-with-judge-report
          path: review-report-with-judge.json
